[project]
name = "aitune"
readme = "docs/pypi.rst"
description = "NVIDIA AITune"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
]
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
keywords = [
    "dynamo",
    "inference",
    "tune",
    "deploy",
    "nvidia",
    "tensorrt",
    "torch-tensorrt",
    "onnx",
    "pytorch",
    "torch",
    "inductor",
    "onnxruntime",
    "deployment",
    "automation",
]
license = { text = "Apache 2.0" }
requires-python = ">=3.11, <3.15"
dependencies = [
    "autowrapt>=1.0",
    "dill>=0.3.8",
    "nvidia-ml-py",
    "nvidia-modelopt[onnx]>=0.33.0", # sets onnxruntime-gpu version
    "numpy>=1.26.4",
    "onnxscript>=0.2.0",
    "onnx-ir>=0.1.11",
    "nvtx",
    "pandas>=2.3",
    "psutil",
    "tabulate>=0.9.0",
    "tensorrt>=10.3",
    "torch>=2.8a0; python_version < '3.14'",
    "torch>=2.14.0a0; python_version == '3.14'",
    "torchao>=0.12",
    "torch-tensorrt>=2.8a0; python_version < '3.14'",
    "torch-tensorrt>=2.14.0a0; python_version == '3.14'",
    "wrapt~=2.0"
]

[project.optional-dependencies]
dynamo = [
    # Dynamo 1.7 changes /health responses; the serving scripts still expect endpoint names there.
    "ai-dynamo-runtime>=0.1,<1.7.0",
    "uvloop",
]
triton = [
    "pydantic>=2",
    "protobuf>=6.33.5,<7", # Model Analyzer 1.54.0 uses FieldDescriptor.label, removed in protobuf 7.
    "PyYAML>=6.0",
    "triton-model-analyzer[perf-analyzer]==1.54.0",
    "tritonclient[grpc]",
]

torch28 = [ # nvcr.io/nvidia/pytorch:25.08-py3 is based on 2.8.0a0+34c6371d24.
    "torch>=2.8.0a0,<2.9; python_version < '3.14'",
    "torch-tensorrt>=2.8.0a0,<2.9; python_version < '3.14'",
    "torchao>=0.12,<0.13",
]
torch29 = [ # nvcr.io/nvidia/pytorch:25.10-py3 is based on 2.9.0a0+145a3a7bda.
    "torch>=2.9.0a0,<2.10; python_version < '3.14'",
    "torch-tensorrt>=2.9.0a0,<2.10; python_version < '3.14'",
    "torchao>=0.14,<0.15",
]
torch210 = [ # nvcr.io/nvidia/pytorch:26.01-py3 is based on 2.10.0a0+a36e1d39eb.
    "torch>=2.10.0a0,<2.11; python_version < '3.14'",
    "torch-tensorrt>=2.10.0a0,<2.11; python_version < '3.14'",
    "torchao>=0.15,<0.16",
    "nvidia-cuda-runtime-cu13==0.0.0a0",
]
torch211 = [ # nvcr.io/nvidia/pytorch:26.03-py3 is based on 2.11.0a0+a6c236b9fd1.
    "torch>=2.11.0a0,<2.12; python_version < '3.14'",
    "torch-tensorrt>=2.11.0a0,<2.12; python_version < '3.14'",
    "torchao>=0.16,<0.17",
]
torch212 = [ # nvcr.io/nvidia/pytorch:26.05-py3 is based on 2.12.0a0+5aff3928d8
    "torch>=2.12.0a0,<2.13; python_version < '3.14'",
    "torch-tensorrt>=2.12.0a0,<2.13; python_version < '3.14'",
    "torchao>=0.17,<0.18",
]
torch213 = [
    "torch>=2.13.0a0,<2.14; python_version < '3.14'",
    "torch-tensorrt>=2.13.0a0,<2.14; python_version < '3.14'",
    "torchao>=0.17",
]
torch214 = [
    "torch>=2.14.0a0,<2.15",
    "torch-tensorrt>=2.14.0a0,<2.15",
    "torchao>=0.17",
]
torch215 = [ # nvcr.io/nvidia/pytorch:26.10-py3 is based on 2.15.0a0+875d815502.
    "torch>=2.15.0a0,<2.16",
    "torch-tensorrt>=2.15.0a0,<2.16",
    "torchao>=0.17",
]

onnxruntime-gpu-cuda13 = ["onnxruntime-gpu"]
onnxruntime-gpu-cuda12 = ["onnxruntime-gpu; python_version < '3.14' and platform_machine != 'aarch64'"]

[project.urls]
"Documentation" = "https://docs.nvidia.com/aitune/"
"Repository" = "https://github.com/ai-dynamo/aitune.git"
"Tracker" = "https://github.com/ai-dynamo/aitune/issues"

[dependency-groups]
# Shared by tests/unit and tests/functional_ci. Keep the legacy catalog independent.
test = [
    "pytest>=9.0.0",
    "pytest-mock",
    "pytest-cov",
    "pytest-xdist",
    "pillow",
    "datasets>=3.3.2",
    "transformers>=5,<6",
    "setuptools",
]
dev = [
    "build >= 0.8",
    "ipython >= 7.16",
    "pdbpp >= 0.10",
    "pip >= 26.2.2",
    "ruff >= 0.3.0",
    "ipykernel",
    "pre-commit",
    "pre-commit-uv",
    "pyrefly==1.4.0",
    "tox",
    "uv>=0.13.4",
]
# Dependencies for the legacy tests/functional catalog and example executor.
# Individual scripts may explicitly install newer versions for their own coverage.
functional-test = [
    "fire",
    "timm",
    "diffusers>=0.35.0,!=0.37.1",
    "datasets>=3.3.2",
    "transformers>=4.57.6,<5",
    "sentencepiece>=0.2.0,<0.2.3", # 0.2.3 needs protobuf>=7, but protobuf is pinned <7 above.
    "urllib3>=2.6.3", # sec
    "kernels>=0.12",
    "sageattention",
]
doc = [
    "PyYAML >= 6.0",
]


[build-system]
requires = ["setuptools>=65.3.0", "setuptools_scm[toml]>=8.3", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "NOTICE.md"]

[tool.setuptools.packages.find]
namespaces = false
include = ["aitune"]

[tool.setuptools.package-data]
aitune = ["**/*"]

[tool.setuptools_scm]

[tool.uv]
managed = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and 'tegra' not in platform_release",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and 'tegra' not in platform_release",
]
conflicts = [
    # The legacy catalog uses Transformers 4; unit and functional_ci tests use Transformers 5.
    [
        { group = "test" },
        { group = "functional-test" },
    ],
    [
        { extra = "torch28" },
        { extra = "torch29" },
        { extra = "torch210" },
        { extra = "torch211" },
        { extra = "torch212" },
        { extra = "torch213" },
        { extra = "torch214" },
        { extra = "torch215" },
    ],
    [
        { extra = "onnxruntime-gpu-cuda13" },
        { extra = "onnxruntime-gpu-cuda12" },
    ],
]

[tool.uv.sources]
onnxruntime-gpu = [
    { index = "ort-cuda-13", extra = "onnxruntime-gpu-cuda13" },
    { index = "ort-cuda-12", extra = "onnxruntime-gpu-cuda12" },
]

[[tool.uv.index]]
name = "ort-cuda-13"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-13/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "ort-cuda-12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = ["--quiet", "--import-mode=importlib", "--doctest-modules"]
pythonpath = ["."]
testpaths = ["aitune", "tests/unit"]
markers = [
    "slow: mark test as slow",
    "dynamo: mark test as requiring ai-dynamo-runtime (skip without aitune[dynamo])",
]

[tool.ruff]
preview = true
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Linter prefixes have no name form in ruff, so they stay as codes with the linter named alongside.
select = [
    "A",    # flake8-builtins: shadowing builtins, e.g. `list = []`
    "B",    # flake8-bugbear: likely bugs, e.g. mutable default `def f(x=[])`
    "C",    # flake8-comprehensions + mccabe (covers C4 and C90)
    "C4",   # flake8-comprehensions: e.g. `list(x for x in y)` -> `[x for x in y]`
    "C90",  # mccabe: function complexity above `max-complexity`
    "D",    # pydocstyle: docstring presence and format (Google convention)
    "E",    # pycodestyle errors: whitespace, indentation, statements
    "F",    # Pyflakes: unused imports/variables, undefined names
    "I",    # isort: import ordering
    "N",    # pep8-naming: e.g. `class my_class` -> `class MyClass`
    "W",    # pycodestyle warnings: trailing whitespace, blank lines
    "T",    # flake8-debugger + flake8-print (covers T10 and T20)
    "T10",  # flake8-debugger: leftover `breakpoint()` / `pdb.set_trace()`
    "T20",  # flake8-print: `print()` / `pprint()` calls
    "UP",   # pyupgrade: modern syntax for `target-version`, e.g. `Optional[X]` -> `X | None`
    "CPY",  # flake8-copyright: SPDX header required (see `notice-rgx`)
    "PIE",  # flake8-pie: e.g. unnecessary `pass` or `...` in a body that has a docstring
    "RSE",  # flake8-raise: e.g. `raise ValueError()` -> `raise ValueError`
    "SLOT", # flake8-slots: `__slots__` required on `str`/`tuple` subclasses
    "FURB", # refurb: modern idioms, e.g. `for x in xs: s.add(x)` -> `s.update(xs)`
    "RET",  # flake8-return: e.g. no `else` after `return`
    "logging-f-string",          # `logger.info(f"x={x}")` -> `logger.info("x=%s", x)`
    "custom-type-var-for-self",  # `def f(self: T) -> T` -> `def f(self) -> Self`
    "assert",                    # no `assert` in `aitune/`; Python drops it under `python -O`
    "banned-api",                # no `cast` in `tests/`
]
ignore = [
    "property-docstring-starts-with-verb",  # allow `"""Return the name."""` on properties
    "line-too-long",                        # `ruff format` handles code; long strings/comments are allowed
    "error-suffix-on-exception-name",       # allow exception classes without `Error` suffix
    "replace-str-enum",                     # keep `class X(str, Enum)`; `StrEnum` changes `str()`/`format()` output
    "unnecessary-assign",                   # allow `x = f(); return x`, which helps debugging
    "unnecessary-return-none",              # allow explicit `return None` in functions that only return `None`
    "implicit-return",                      # don't require `return None` at the end of non-`None` functions
    "reimplemented-operator",               # allow `lambda x: x[0]` instead of `operator.itemgetter(0)`
    "reimplemented-starmap",                # keep `f(a, b) for a, b in xs`; `starmap` is slower since Python 3.12
]
exclude = ["**/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["undocumented-public-package"]  # no module docstring required in `__init__.py`
"**/__version__.py" = ["undocumented-public-module"]
"!aitune/**" = ["assert"]  # asserts are fine in tests, scripts, and `conftest.py`
"!tests/**" = ["banned-api"]
"**/{tests,docs,tools,examples}/*" = [
    "unnecessary-comprehension",  # allow `[x for x in y]` instead of `list(y)`
    "D",                          # pydocstyle: docstrings optional
    "print",                      # `print()` allowed
    "subclass-builtin",           # allow `class FakeDict(dict)` test doubles
    "math-constant",              # allow literal values such as `3.14` in test data
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "Use assert isinstance instead of cast in tests."
"typing_extensions.cast".msg = "Use assert isinstance instead of cast in tests."

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-copyright]
notice-rgx = "# SPDX-FileCopyrightText: Copyright \\(c\\) 2026 NVIDIA CORPORATION & AFFILIATES\\. All rights reserved\\.(\n# SPDX-FileCopyrightText: .*)*\n# SPDX-License-Identifier: Apache-2\\.0"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.vulture]
exclude = []
ignore_decorators = []
ignore_names = []
make_whitelist = true
min_confidence = 80
paths = ["aitune"]
sort_by_size = true
verbose = false

[tool.pyrefly]
project-includes = ["aitune", "tests", "examples"]
python-version = "3.11"
preset = "default"
baseline = "pyrefly-baseline.json"
replace-imports-with-any = ["tritonclient.grpc.model_config_pb2"]

[tool.pyrefly.errors]
missing-import = "ignore"
deprecated = "error"
pytorch-efficiency-lint-redundant-to-call = "error"
pytorch-efficiency-lint-cuda-call = "error"
pytorch-efficiency-lint-item-call = "error"

# the following enables autowrapt to conditionally enable JIT tuning i.e. `AUTOWRAPT_BOOTSTRAP=aitune_enable_jit_tuning python script.py`
[project.entry-points.aitune_enable_jit_tuning]
torch = "aitune.torch.jit.enable:wrapt_auto_enable"
