# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json

language: en-US
early_access: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  review_details: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - Draft
      - WIP

  auto_apply_labels: true
  labeling_instructions:
    - label: "review-effort/low"
      instructions: >
        Apply when the pull request is narrow, low-risk, and can likely be
        reviewed in under 15 minutes.

    - label: "review-effort/medium"
      instructions: >
        Apply when the pull request has multiple meaningful changes or likely
        needs 15–45 minutes of review.

    - label: "review-effort/high"
      instructions: >
        Apply when the pull request changes architecture, spans several
        components, modifies public APIs, or likely needs over 45 minutes.

chat:
  auto_reply: true
