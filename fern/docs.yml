# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

title: NVIDIA AITune Documentation

instances:
  - url: aitune.docs.buildwithfern.com/aitune
    custom-domain: docs.nvidia.com/aitune
    multi-source: true

metadata:
  canonical-host: "docs.nvidia.com/aitune"

global-theme: nvidia

agents:
  page-directive: "For clean Markdown content of this page, append .md to this URL."

products:
  - display-name: AITune
    slug: /
    path: ../docs/index.yml
    versions:
      - display-name: dev
        slug: dev
        path: ../docs/index.yml

redirects:
  - source: "/aitune/guides/ahead-of-time-tuning"
    destination: "/aitune/guides/ahead-of-time/tune-pytorch"
  - source: "/aitune/guides/ahead-of-time-inspect"
    destination: "/aitune/guides/ahead-of-time/inspect-pytorch"
  - source: "/aitune/guides/onnx-model-tuning"
    destination: "/aitune/guides/ahead-of-time/tune-onnx"
  - source: "/aitune/guides/just-in-time-tuning"
    destination: "/aitune/guides/just-in-time/tune"
  - source: "/aitune/guides/just-in-time-inspect"
    destination: "/aitune/guides/just-in-time/inspect"
  - source: "/aitune/dev/guides/ahead-of-time-tuning"
    destination: "/aitune/dev/guides/ahead-of-time/tune-pytorch"
  - source: "/aitune/dev/guides/ahead-of-time-inspect"
    destination: "/aitune/dev/guides/ahead-of-time/inspect-pytorch"
  - source: "/aitune/dev/guides/onnx-model-tuning"
    destination: "/aitune/dev/guides/ahead-of-time/tune-onnx"
  - source: "/aitune/dev/guides/just-in-time-tuning"
    destination: "/aitune/dev/guides/just-in-time/tune"
  - source: "/aitune/dev/guides/just-in-time-inspect"
    destination: "/aitune/dev/guides/just-in-time/inspect"
  - source: "/aitune/learn/backends"
    destination: "/aitune/guides/backends/overview"
  - source: "/aitune/dev/learn/backends"
    destination: "/aitune/dev/guides/backends/overview"
  - source: "/aitune/learn/core-functionalities"
    destination: "/aitune/learn/core-concepts"
  - source: "/aitune/dev/learn/core-functionalities"
    destination: "/aitune/dev/learn/core-concepts"
  - source: "/aitune/index.html"
    destination: "/aitune"
  - source: "/aitune/dev/index.html"
    destination: "/aitune/dev"
  - source: "/aitune/resources/license"
    destination: "https://github.com/ai-dynamo/aitune/blob/main/LICENSE"
  - source: "/aitune/v0.5.0/resources/license"
    destination: "https://github.com/ai-dynamo/aitune/blob/main/LICENSE"

navbar-links:
  - type: github
    value: https://github.com/ai-dynamo/aitune

footer: ./components/CustomFooter.tsx

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

colors:
  accentPrimary:
    dark: "#76B900"
    light: "#005020"
  background:
    light: "#FFFFFF"
    dark: "#000000"

typography:
  bodyFont:
    name: NVIDIA
    paths:
      - path: ../docs/assets/fonts/NVIDIASans.woff2
        style: normal
      - path: ../docs/assets/fonts/NVIDIASans_Italic.woff2
        style: italic
  codeFont:
    name: RobotoMono
    paths:
      - path: ../docs/assets/fonts/RobotoMono.woff2

logo:
  dark: ../docs/assets/NVIDIA_dark.svg
  light: ../docs/assets/NVIDIA_light.svg
  height: 20
  href: /aitune
  right-text: Documentation

favicon: ../docs/assets/NVIDIA_symbol.svg

css:
  - ./main.css

experimental:
  mdx-components:
    - ../docs/_components
    - ./components

libraries:
  aitune:
    input:
      path: ..
    output:
      path: ../docs/api
    lang: python

check:
  rules:
    broken-links: warn
    example-validation: error
    missing-redirects: warn
