[project]
name = "aitune-resnet-example"
version = "0.1.0"
description = "NVIDIA AITune ResNet Example"
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.10, <3.13"
dependencies = [
    "aitune",
    "torch",
    "torchvision",
    "timm",
    "pillow",
]

[project.optional-dependencies]
dynamo = [
    "aitune-examples-common",
    "ai-dynamo==0.6.0",
    "uvicorn",
    "aiohttp",
    "aiofiles>=24.1.0",
    "python-multipart",
    "pydantic-tensor",
]

[tool.uv.sources]
aitune = { path = "../../" }
aitune-examples-common = { path = "../../examples/common" }

[project.scripts]
tune = "resnet.tune:main"
inference = "resnet.inference:main"

[build-system]
requires = ["setuptools>=65.3.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["resnet"]

[tool.setuptools.package-data]
resnet = ["**/*"]

[tool.aitune]
arguments = [{ "image-path" = "dog.webp" }]
