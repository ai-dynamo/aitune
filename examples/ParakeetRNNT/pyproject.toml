[project]
name = "aitune-parakeet-rnnt-example"
version = "0.1.0"
description = "NVIDIA AITune Parakeet RNNT Example"
readme = "README.md"
requires-python = ">=3.10, <3.13"

dependencies = [
    "aitune",
    "megatron-core",
    "nemo-toolkit[asr]",
]

[project.optional-dependencies]
dynamo = [
    "aitune-examples-common",
    "ai-dynamo==0.6.0",
    "aiofiles",
    "aiohttp",
    "cuda-python",
    "uvicorn",
    "python-multipart",
]

[tool.uv.sources]
aitune = { path  = "../../" }
aitune-examples-common = { path = "../../examples/common" }

[project.scripts]
tune = "parakeet_rnnt.tune:main"
inference = "parakeet_rnnt.inference:main"
benchmark = "parakeet_rnnt.benchmark:main"

[build-system]
requires = ["setuptools>=65.3.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["parakeet_rnnt"]

[tool.setuptools.package-data]
parakeet_rnnt = ["**/*"]

[tool.aitune]
docker_image = "nvcr.io/nvidia/pytorch:25.10-py3"
