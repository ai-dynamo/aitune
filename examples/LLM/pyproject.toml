[project]
name = "ai-tune-llm-example"
version = "0.1.0"
description = "NVIDIA AITune LLM Example"
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.10, <3.13"

dependencies = [
    "aitune",
    "accelerate",
    "torch",
    "transformers>=4.54,<5",
]

[tool.uv.sources]
aitune = { path = "../../" }

[project.scripts]
tune = "llm.tune:main"
inference = "llm.tune:main"
benchmark = "llm.benchmark:main"
benchmark-all = "llm.benchmark_all:main"

[build-system]
requires = ["setuptools>=65.3.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["llm"]

[tool.setuptools.package-data]
llm = ["**/*"]

[tool.aitune]
variants = [
    { arguments = { "model_id" = "Qwen/Qwen3-0.6B", "max-new-tokens" = 2 } },
    { arguments = { "multi-gpu" = true, "model_id" = "Qwen/Qwen3-0.6B", "cache" = "dynamic", "max-new-tokens" = 2 }, additional_tags = ["gpu/4"], launcher = "torchrun", processes = 4 },
    { arguments = { "multi-gpu" = true, "model_id" = "Qwen/Qwen3-0.6B", "cache" = "no_cache", "max-new-tokens" = 2 }, additional_tags = ["gpu/4"], launcher = "torchrun", processes = 4 },
]
additional_tags = ["mem/80g"]
use_gated_hf_token = true
