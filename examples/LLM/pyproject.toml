[project]
name = "ai-tune-llm-example"
version = "0.1.0"
description = "NVIDIA AITune LLM Example"
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.10, <3.13"

dependencies = [
    "aitune",
    "torch",
    "transformers<5",
]

[tool.uv.sources]
aitune = { path = "../../" }

[project.scripts]
tune = "llm.tune:main"
inference = "llm.tune:main"
benchmark = "llm.benchmark:main"
benchmark-all = "llm.benchmark_all:main"

[build-system]
requires = ["setuptools>=65.3.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["llm"]

[tool.setuptools.package-data]
llm = ["**/*"]

[tool.aitune]
docker_image = "nvcr.io/nvidia/pytorch:25.09-py3"
additional_tags = ["mem/80g"]
use_gated_hf_token = true
