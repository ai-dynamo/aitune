[project]
name = "ai-tune-wan-example"
version = "0.1.0"
description = "NVIDIA AITune WAN 2.1 text-to-video example"
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.11, <3.14"

dependencies = [
    "accelerate",
    "aitune",
    "aitune-examples-common",
    "diffusers>=0.37.1,<0.38",
    "ftfy",
    "imageio[ffmpeg]",
    "sentencepiece",
    "torch>=2.0.0",
    "transformers>=4.57.6,<5",
]

[project.optional-dependencies]
dynamo = [
    "ai-dynamo>=1.3,<2.0.0",
    "aiofiles",
    "aiohttp",
    "httpx",
    "pyyaml",
    "uvicorn",
    "uvloop",
]

[tool.uv.sources]
aitune = { path = "../../", editable = true }
aitune-examples-common = { path = "../../examples/common" }

[project.scripts]
tune = "wan.tune:main"
inference = "wan.inference:main"

[build-system]
requires = ["setuptools>=65.3.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["wan*"]

[tool.setuptools.package-data]
wan = ["**/*"]

[tool.aitune]
docker_image = "nvcr.io/nvidia/pytorch:26.06-py3"
variants = [
    { arguments = { "num-frames" = 81, "steps" = 30 } },
    { arguments = { "context-parallel" = "ulysses", "num-frames" = 81, "steps" = 30 }, additional_tags = ["gpu/4"], launcher = "torchrun", processes = 4 },
]
additional_tags = ["gpu/sm/120"]
use_gated_hf_token = true
allow_failure = true
