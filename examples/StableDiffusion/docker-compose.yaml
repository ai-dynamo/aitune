services:
  nats-server:
    image: nats
    command: [ "-js", "--trace" ]
    ports:
      - 4222:4222
      - 6222:6222
      - 8222:8222
    profiles:
      - aux
      - all

  etcd-server:
    image: bitnami/etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    ports:
      - 2379:2379
      - 2380:2380
    profiles:
      - aux
      - all

  stable-diffusion-frontend:
    environment:
      NATS_SERVER: "nats://nats-server:4222"
      ETCD_ENDPOINTS: "http://etcd-server:2379"
      AI_TUNE_CACHE_DIR: /opt/dynamo/app/cache
    build:
      context: .
      additional_contexts:
        # we need aitune and we are using local version
        aitune: ../..
      dockerfile: Dockerfile.dynamo
    ports:
      - 8000:8000
    depends_on:
      - nats-server
      - etcd-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - cache:/opt/dynamo/app/cache
    profiles:
      - all

volumes:
  cache:
    driver: local
