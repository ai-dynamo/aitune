[project]
name = "ai-tune-stable-diffusion-example"
version = "0.1.0"
description = "NVIDIA AITune Stable Diffusion 3 Example"
readme = "README.md"
license = { text = "Apache 2.0" }
requires-python = ">=3.9, <4"

dependencies = [
    "aitune",
    "diffusers>=0.25.0",
    "torch>=2.0.0",
    "transformers",
    "pillow",
    "sentencepiece",
    "protobuf",
]

[tool.uv.sources]
aitune = { path = "../../" }

[project.scripts]
tune = "stable_diffusion.tune:main"
inference = "stable_diffusion.inference:main"

[build-system]
requires = ["setuptools>=65.3.0", "setuptools_scm>=2.0.0,<3", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["stable_diffusion"]

[tool.setuptools.package-data]
stable_diffusion = ["**/*"]

[tool.aitune]
additional_tags = ["gpu/h100"]