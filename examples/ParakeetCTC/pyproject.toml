[project]
name = "aitune-parakeet-ctc-example"
version = "0.1.0"
description = "NVIDIA AITune Parakeet CTC Example"
readme = "README.md"
requires-python = ">=3.10, < 3.13"

dependencies = [
    "aitune",
    "nemo-toolkit[asr]",
]

[tool.uv.sources]
aitune = { path  = "../../" }

[project.scripts]
tune = "parakeet_ctc.tune:main"
inference = "parakeet_ctc.inference:main"

[build-system]
requires = ["setuptools>=65.3.0", "setuptools_scm>=2.0.0,<3", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["parakeet_ctc"]

[tool.setuptools.package-data]
parakeet_ctc = ["**/*"]

[tool.aitune]
[[tool.aitune.arguments]]
audio_path = "2086-149220-0033.wav"
