[project]
name = "aitune-parakeet-ctc-example"
version = "0.1.0"
description = "NVIDIA AITune Parakeet CTC Example"
readme = "README.md"
requires-python = ">=3.10, <3.13"

dependencies = [
    "aitune",
    "megatron-core",
    "nemo-toolkit[asr]",
]

[project.optional-dependencies]
dynamo = [
    "aitune-examples-common",
    "ai-dynamo==0.6.0",
    "uvicorn",
    "aiofiles>=24.1.0",
    "python-multipart",
    "colored",
]

[tool.uv.sources]
aitune = { path  = "../../" }
aitune-examples-common = { path = "../../examples/common" }

[project.scripts]
tune = "parakeet_ctc.tune:main"
inference = "parakeet_ctc.inference:main"

[build-system]
requires = ["setuptools>=65.3.0", "wheel>=0.37.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
namespaces = false
include = ["parakeet_ctc"]

[tool.setuptools.package-data]
parakeet_ctc = ["**/*"]

[tool.aitune]
docker_image = "nvcr.io/nvidia/pytorch:25.10-py3"
[[tool.aitune.arguments]]
audio_path = "2086-149220-0033.wav"
