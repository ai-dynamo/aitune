# Validated on one NVIDIA RTX 6000 Ada GPU; see README.md for the measured workload.
name: single-gpu
model:
  base_model: black-forest-labs/FLUX.1-schnell
  revision: 741f7c3ce8b383c54771c7003378a50191e9efe9
execution:
  gpu_count: 1
  context_parallel: ulysses
tuning:
  quantization: false
artifact_path: ../results/single-gpu/artifact/tuned.ait
output_dir: ../results/single-gpu
inputs:
  tune: ../samples/tune.jsonl
  validation: ../samples/validation.jsonl
  inference: ../samples/inference.jsonl
  benchmark: ../samples/validation.jsonl
workload:
  width: 1024
  height: 1024
  num_inference_steps: 4
  guidance_scale: 0.0
  max_sequence_length: 256
benchmark:
  warmup_iterations: 3
  repetitions: 20
  sampling_interval_s: 0.05
validation:
  metric: rgb_ssim
  threshold: 0.70
  soft_threshold: 0.95  # Warn below this score; only threshold determines failure.
deployment:
  port: 8000
  web_host: 0.0.0.0
  web_port: 8080
  seed: 42
  request_count: 20
  readiness_timeout_s: 1800
