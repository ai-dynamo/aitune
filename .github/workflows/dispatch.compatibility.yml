name: Compatibility

on:
  workflow_dispatch:
    inputs: &inputs
      run_nvcr_container:
        description: Run NVCR container
        type: boolean
        default: true
      run_cuda_matrix:
        description: Run CUDA Python matrix
        type: boolean
        default: true
  merge_group:
    branches: [main]
  workflow_call:
    inputs: *inputs
permissions:
  contents: read
  packages: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_VERSION: 0.12.8
  UV_PYTHON: "3.12"
  ONNXRUNTIME_VERSION: 1.24.4

  # This runner inherits NCCL_NET_PLUGIN=ofi, which forces the AWS EFA/Libfabric
  # plugin. RTX runners have no EFA provider, so OFI initialization fails and
  # NCCL segfaults during process-group creation. Use NCCL's built-in Socket
  # transport for this single-node, 4xGPU sanity check.
  # fix for error: Segmentation fault: address not mapped to object at address (nil)
  NCCL_NET_PLUGIN: none
  NCCL_NET: Socket

defaults:
  run:
    shell: bash

jobs:
  pytorch-gpu-nvcr-container:
    name: PyTorch GPU on nvcr ${{ matrix.nvcr }}
    runs-on: prod-aitune-tester-rtx-pro-4500-v1
    timeout-minutes: 45
    if: inputs.run_nvcr_container == true
    strategy:
      fail-fast: false
      matrix:
        nvcr: ["25.08", "25.10", "26.01", "26.03", "26.05", "26.06", "26.08"]
        include:
          - nvcr: "25.08"
            extra_packages: "numpy<2.0 pyarrow<26"
    container:
      image: ghcr.io/ai-dynamo/aitune/nvcr-torch-${{ matrix.nvcr }}-py3:latest
      options: -u 1000
    env:
      EXTRA_PACKAGES: ${{ matrix.extra_packages }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install and test
        run: |
          # shellcheck disable=SC2086 # split EXTRA_PACKAGES into separate requirements
          pip install ".[triton]" --group test $EXTRA_PACKAGES
          pip install onnxruntime-gpu==${{ env.ONNXRUNTIME_VERSION }} --no-deps --force-reinstall --upgrade --index-url https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ort-cuda-13-nightly/pypi/simple/
          pip list
          nvidia-smi
          python -c "
          import sys, torch, tensorrt, torch_tensorrt
          print(sys.version)
          print(torch.__version__, torch.version.cuda)
          print(torch.cuda.is_available()); torch.cuda.init()
          print(tensorrt.__version__)
          print(torch_tensorrt.__version__)
          "
          pytest

  pytorch-gpu-cuda-python-matrix:
    name: ${{ matrix.cuda.uv_torch_backend }} py${{ matrix.python_version }} ${{ matrix.torch }}
    runs-on: prod-aitune-tester-rtx-pro-4500-v1
    timeout-minutes: 45
    if: inputs.run_cuda_matrix == true
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AITUNE: 0.0.0a0
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
        torch: [torch29, torch210, torch211, torch212]
        cuda:
          - &cu128
            uv_torch_backend: cu128
            cuda_image: 12.9.2-devel-ubuntu24.04
            cuda_major: 12
            uv_extra_args: nvidia-cuda-runtime-cu13==0.0.0a0 --excludes ./cu12-excludes.txt --reinstall-package tensorrt-cu12 --reinstall-package tensorrt-cu12-bindings --reinstall-package tensorrt-cu12-libs
          - &cu130
            uv_torch_backend: cu130
            cuda_image: 13.0.3-devel-ubuntu24.04
            cuda_major: 13
            uv_extra_args: ""
        exclude:
          # no torch-tensorrt==2.10 in pypi
          - torch: torch210
            cuda: *cu128
          - torch: torch212
            cuda: *cu128
        include:
          - python_version: "3.14"
            torch: torch214
            cuda: *cu130
    container:
      image: ghcr.io/ai-dynamo/aitune/cuda-${{ matrix.cuda.cuda_image }}:latest
    steps:
      - name: Install Node for local act
        if: ${{ env.ACT == 'true' }}
        run: |
          node_dir="$RUNNER_TEMP/node"
          mkdir -p "$node_dir"
          curl -fsSL https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.gz \
            | tar -xz --strip-components=1 -C "$node_dir"
          echo "$node_dir/bin" >> "$GITHUB_PATH"
          "$node_dir/bin/node" --version
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          python-version: ${{ matrix.python_version }}
          version: ${{ env.UV_VERSION }}
      # - run: nvidia-smi
      - name: Install and test
        run: |
          uv venv
          printf "tensorrt\n" > cu12-excludes.txt
          uv pip install --torch-backend=${{ matrix.cuda.uv_torch_backend }} ".[${{ matrix.torch }},onnxruntime-gpu-cuda${{ matrix.cuda.cuda_major }},triton]" --group test ${{ matrix.cuda.uv_extra_args }}
          uv pip list
          .venv/bin/python .github/scripts/sanity/print_versions.py
          .venv/bin/python .github/scripts/sanity/check_onnxruntime_cuda.py --cuda-major-version=${{ matrix.cuda.cuda_major }}
          .venv/bin/python -m pytest -q -rf
