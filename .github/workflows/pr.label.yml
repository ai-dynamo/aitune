name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  INCLUDE_DELETIONS: false

jobs:
  component-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

  code-size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add size label to PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_DELETIONS: ${{ env.INCLUDE_DELETIONS }}
        with:
          script: |

            const sizeLabels = ['size/S', 'size/XS', 'size/M', 'size/L', 'size/XL', 'size/XXL']
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const includeDeletions = process.env.INCLUDE_DELETIONS === 'true'

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            })
            const lines = pr.additions + (includeDeletions ? pr.deletions : 0)
            const label =
              lines <= 50 ? 'size/XS'
              : lines <= 80 ? 'size/S'
              : lines <= 120 ? 'size/M'
              : lines <= 150 ? 'size/L'
              : lines <= 200 ? 'size/XL'
              : 'size/XXL'
            // Get existing size labels
            const { data: existing } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number,
            })
            // Remove existing size labels that are not the current label
            for (const name of existing.map((item) => item.name)) {
              if (sizeLabels.includes(name) && name !== label) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name })
              }
            }
            // Add the new size label
            if (!existing.some((item) => item.name === label)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [label],
              })
            }
            core.info(`${lines} changed lines -> ${label}`)