name: Create AITune containers for nightly testing

on:
  schedule:
    - cron: "0 0 * * 1,2,3,4,5"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: create-aitune-containers-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_VERSION: ${{ vars.UV_VERSION }}
  UV_PYTHON: &python_version "3.12"

defaults:
  run:
    shell: bash

jobs:
  wheel:
    name: Build wheel
    runs-on: linux-amd64-cpu4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: *python_version
          version: ${{ env.UV_VERSION }}
      - run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  create-base-images:
    name: create pytorch ${{ matrix.torch_ci_image_base }} based AITune image
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    needs: wheel
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        torch_ci_image_base: [25.08-py3, 25.10-py3, 26.01-py3, 26.03-py3, 26.05-py3, 26.06-py3, 26.08-py3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .github/docker/Dockerfile
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          build-args: |
            FROM_IMAGE=nvcr.io/nvidia/pytorch:${{ matrix.torch_ci_image_base }}
            AITUNE_CI_IMAGE_CREATION_DATE=${{ github.event.head_commit.timestamp }}
          tags: ghcr.io/ai-dynamo/aitune/nvcr-torch-${{ matrix.torch_ci_image_base }}:latest
      - id: image
        run: echo "image=ghcr.io/ai-dynamo/aitune/nvcr-torch-${{ matrix.torch_ci_image_base }}:latest" >> "$GITHUB_OUTPUT"

  create-triton-base-images:
    name: create triton ${{ matrix.triton_ci_image_base }} based CI image
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    needs: wheel
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Triton images bundle a specific PyTorch backend, so keep the Torch extra aligned with the image release.
          - triton_ci_image_base: 26.05-py3
            aitune_extras: triton,torch212
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .github/docker/triton.Dockerfile
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          build-args: |
            FROM_IMAGE=nvcr.io/nvidia/tritonserver:${{ matrix.triton_ci_image_base }}
            AITUNE_EXTRAS=${{ matrix.aitune_extras }}
          tags: ghcr.io/ai-dynamo/aitune/nvcr-triton-${{ matrix.triton_ci_image_base }}:latest

  create-cuda-base-images:
    name: create cuda ${{ matrix.cuda_ci_image_base }} based AITune image
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    needs: wheel
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        cuda_ci_image_base:
            - 12.9.2-devel-ubuntu24.04
            - 13.0.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .github/docker/cuda.Dockerfile
          outputs: type=image,push=true,compression=zstd,force-compression=true,oci-mediatypes=true
          build-args: |
            FROM_IMAGE=nvcr.io/nvidia/cuda:${{ matrix.cuda_ci_image_base }}
            AITUNE_CI_IMAGE_CREATION_DATE=${{ github.event.head_commit.timestamp }}
          tags: ghcr.io/ai-dynamo/aitune/cuda-${{ matrix.cuda_ci_image_base }}:latest
      - id: image
        run: echo "image=ghcr.io/ai-dynamo/aitune/cuda-${{ matrix.cuda_ci_image_base }}:latest" >> "$GITHUB_OUTPUT"

  warm-gpu-runner-cache:
    name: warm ${{ matrix.runner }} image cache
    needs: create-base-images
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [prod-aitune-tester-rtx-pro-4500-v1]
    # Pull the freshly pushed PR CI image onto the GPU node so the first PR job of the day starts warm.
    container:
      image: ${{ vars.TORCH_CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: python -c "import aitune"
