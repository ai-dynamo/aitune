name: Functional tests

on:
  workflow_dispatch:
    inputs:
      pytorch_ci_image:
        description: PyTorch image; empty uses vars.TORCH_CI_IMAGE
        type: string
        default: ''
  merge_group:
    branches: [main]
  workflow_call:
    inputs:
      pytorch_ci_image:
        description: PyTorch image selected by CI; empty uses the commit image
        type: string
        default: ''
      dist_run_id:
        description: Run containing the dist artifact for this commit; empty builds a fresh wheel
        type: string
        default: ''
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read
  packages: read
  actions: read # Download the caller's wheel artifact.

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_VERSION: ${{ vars.UV_VERSION }}
  UV_PYTHON: &python_version "3.12"
  PYTORCH_CI_IMAGE: ${{ inputs.pytorch_ci_image || (github.event_name == 'workflow_dispatch' && vars.TORCH_CI_IMAGE) || format('ghcr.io/{0}:{1}', github.repository, github.sha) }}

  # This runner inherits NCCL_NET_PLUGIN=ofi, which forces the AWS EFA/Libfabric
  # plugin. RTX runners have no EFA provider, so OFI initialization fails and
  # NCCL segfaults during process-group creation. Use NCCL's built-in Socket
  # transport for this single-node, 4xGPU sanity check.
  # fix for error: Segmentation fault: address not mapped to object at address (nil)
  NCCL_NET_PLUGIN: none
  NCCL_NET: Socket

defaults:
  run:
    shell: bash

jobs:
  generate-functional-matrix:
    name: Generate functional matrix
    runs-on: linux-amd64-cpu4
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      matrix_count: ${{ steps.generate.outputs.matrix_count }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: *python_version
          version: ${{ env.UV_VERSION }}
      # Standalone dispatches and merge groups build the selected commit's wheel.
      # Nightly supplies its CI artifact instead.
      - name: Build wheel
        if: inputs.dist_run_id == ''
        run: uv build
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.dist_run_id == ''
        with:
          name: integration-dist
          path: dist/
          if-no-files-found: error
      - name: Generate functional matrix
        id: generate
        env:
          AITUNE_TEST_SCOPE: L0
          AITUNE_EXAMPLE_SCOPE: L1
        run: |
          uv run --script tests/functional/scripts/generate.py \
            --default-docker-image "${{ env.PYTORCH_CI_IMAGE }}" \
            --scripts-path tests/functional/pytorch \
            --scripts-path tests/functional/pytorch/jit \
            --scripts-path tests/functional/pytorch/kernel_forge \
            --scripts-path tests/functional/onnx \
            --scripts-path tests/functional/dataloader \
            --scripts-path tests/functional/dynamo \
            --github-output "$GITHUB_OUTPUT" \
            --output-json jobs.json

      - name: Display generated functional matrix
        if: always()
        run: |
          {
            echo "### Functional Matrix"
            echo -ne "\nTotal matrix items: ${{ steps.generate.outputs.matrix_count }}\n\n"
            echo "| ID | Path | Kind | Docker Image | Runner | Test Number |"
            echo "|----|------|------|--------------|--------|-------------|"
            jq -r '.[] | "| \(.id) | \(.path) | \(.kind) | \(.docker_image) | \(.runner) | \(.test_number) |"' jobs.json
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  functional:
    name: ${{ matrix.id }}
    needs: generate-functional-matrix
    if: needs.generate-functional-matrix.outputs.matrix_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-functional-matrix.outputs.matrix) }}
    container:
      image: ${{ matrix.docker_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env: ${{ fromJSON(matrix.environment) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.dist_run_id != '' && 'dist' || 'integration-dist' }}
          path: dist
          run-id: ${{ inputs.dist_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Replace AITune baked into the base/custom image with this commit's wheel.
      - name: Install wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: nvidia-smi
      - name: Run functional job
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python tests/functional/scripts/metadata.py ${{ matrix.path }} | tee script_metadata.json
          # DO NOT ADD ANY CODE HERE, execute.py MUST prepare the environment for the functional test
          python tests/functional/scripts/execute.py \
            "${{ matrix.path }}" \
            --kind "${{ matrix.kind }}" \
            --test-number "${{ matrix.test_number }}" \
            --verbose

      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-${{ matrix.id }}
          path: |
            artifacts/**
            .cache/aitune/**/*.log
            .cache/aitune.jit/**/*.log
            hardware_metrics.csv
            script_metadata.json
            functional_test_requirements.txt
          if-no-files-found: ignore
