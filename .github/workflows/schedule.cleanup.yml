name: Clean up old AITune containers

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      older_than:
        description: Delete images older than this interval (e.g. 2 weeks, 1 month, 3 months)
        default: 1 month
      dry_run:
        description: Only log what would be deleted
        type: boolean
        default: true

permissions: {}

concurrency:
  group: cleanup-aitune-containers
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean up ghcr.io images
    if: github.repository_owner == 'ai-dynamo'
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          # Wildcard package expansion needs a classic PAT with read, write and delete:packages scopes.
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          packages: aitune,aitune/*
          expand-packages: true
          exclude-tags: latest,buildcache
          older-than: ${{ inputs.older_than || '1 month' }}
          keep-n-tagged: 0
          delete-untagged: true
          dry-run: ${{ inputs.dry_run || false }}
