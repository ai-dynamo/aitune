name: Nightly CI

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      example_scope:
        description: Example scope (L0-L3)
        required: false
        default: L1
        type: choice
        options:
          - L0
          - L1
          - L2
          - L3
      skip_main_ci:
        description: "Opt-out of running main CI (provide required artifacts and image manually)"
        required: false
        type: boolean
        default: false
      dist_run_id:
        description: "dist artifact run ID (required if skip_main_ci=true)"
        required: false
      pytorch_image:
        description: "SHA-tagged PyTorch CI image (required if skip_main_ci=true)"
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_VERSION: 0.12.8
  UV_PYTHON: &python_version "3.12"
  TORCH_CI_IMAGE: nvcr.io/nvidia/pytorch:26.01-py3
  # PYTORCH_CI_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }} 
  PYTORCH_CI_IMAGE: &pytorch_ci_image ghcr.io/ai-dynamo/aitune:82eb49ab9301930fdafcb772404d8538d0b011bc

  # This runner inherits NCCL_NET_PLUGIN=ofi, which forces the AWS EFA/Libfabric
  # plugin. RTX runners have no EFA provider, so OFI initialization fails and
  # NCCL segfaults during process-group creation. Use NCCL's built-in Socket
  # transport for this single-node, 4xGPU sanity check.
  # fix for error: Segmentation fault: address not mapped to object at address (nil)
  NCCL_NET_PLUGIN: none
  NCCL_NET: Socket

  # Actions version pins
  _ACTIONS_CHECKOUT: &actions_checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  _ACTIONS_SETUP_UV: &actions_setup_uv astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
  _ACTIONS_DOWNLOAD_ARTIFACT: &actions_download_artifact actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
  _ACTIONS_UPLOAD_ARTIFACT: &actions_upload_artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  _ACTIONS_DOCKER_LOGIN: &actions_docker_login docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
  _ACTIONS_DOCKER_BUILD_PUSH: &actions_docker_build_push docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0



defaults:
  run:
    shell: bash

jobs:
  wheel:
    name: Build wheel
    runs-on: linux-amd64-cpu4
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv build
      - uses: *actions_upload_artifact
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-4-rank-sanity:
    name: Test 4-rank sanity
    runs-on: prod-aitune-tester-rtx-pro-4500-4-v1
    timeout-minutes: 15
    container:
      image: *pytorch_ci_image
    env:
      NCCL_DEBUG: INFO
      NCCL_DEBUG_SUBSYS: INIT,NET,GRAPH
      UCX_LOG_LEVEL: info
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - run: nvidia-smi
      - run: nvidia-smi -L
      - run: nvidia-smi topo -m
      - run: |
          python -c "import sys; print(sys.version)"
          python -c "import torch; print('PyTorch version:', torch.__version__); print('CUDA version:', torch.version.cuda)"
          python -c "import torch; print('CUDA is available:', torch.cuda.is_available()); torch.cuda.init()"
          python -c "import torch; print('CUDA devices:', torch.cuda.device_count())"
          python -c "import tensorrt; print('TensorRT version:', tensorrt.__version__)"
          python -c "import torch_tensorrt; print('Torch-TensorRT version:', torch_tensorrt.__version__)"
      - run: python .github/scripts/nccl_4_rank_sanity.py

  create-base-images:
    name: Create AITune images from NVCR PyTorch images
    runs-on: linux-amd64-cpu4
    timeout-minutes: 45
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        torch_ci_image_base: [25.08-py3, 25.10-py3, 26.01-py3, 26.03-py3, 26.05-py3, 26.06-py3]
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - uses: *actions_docker_login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: *actions_docker_build_push
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          build-args: |
            FROM_IMAGE=nvcr.io/nvidia/pytorch:${{ matrix.torch_ci_image_base }}
          tags: ghcr.io/ai-dynamo/aitune:nvcr-torch-${{ matrix.torch_ci_image_base }}
      - id: image
        run: echo "image=ghcr.io/ai-dynamo/aitune:nvcr-torch-${{ matrix.torch_ci_image_base }} >> "$GITHUB_OUTPUT"
    
  pytorch-image:
    name: Build PyTorch image
    needs: wheel
    runs-on: linux-amd64-cpu4
    outputs:
      image: ${{ steps.image.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - uses: *actions_docker_login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: *actions_docker_build_push
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          build-args: |
            FROM_IMAGE=nvcr.io/nvidia/pytorch:26.06-py3
          tags: ghcr.io/ai-dynamo/aitune:26.06-py3
      - id: image
        run: echo "image=${{ env.PYTORCH_CI_IMAGE }}" >> "$GITHUB_OUTPUT"

  # main-ci-vars:
  #   name: Main CI Variables (pytorch_image and dist_run_id)
  #   runs-on: linux-amd64-cpu4
  #   needs: ${{ inputs.skip_main_ci && fromJSON('[]') || 'main-ci' }}
  #   outputs:
  #     pytorch_image: ${{ steps.set-vars.outputs.pytorch_image }}
  #     dist_run_id: ${{ steps.set-vars.outputs.dist_run_id }}
  #   steps:
  #     - id: set-vars
  #       run: |
  #         if [[ "${{ inputs.skip_main_ci }}" == 'true' ]]; then
  #           if [[ -z "${{ inputs.pytorch_image }}" || -z "${{ inputs.dist_run_id }}" ]]; then
  #             echo "Both dist_run_id and pytorch_image must be provided when skip_main_ci=true" >&2
  #             exit 1
  #           fi
  #           echo "pytorch_image=${{ inputs.pytorch_image }}" >> $GITHUB_OUTPUT
  #           echo "dist_run_id=${{ inputs.dist_run_id }}" >> $GITHUB_OUTPUT
  #         else
  #           echo "pytorch_image=${{ needs.main-ci.outputs.pytorch_image }}" >> $GITHUB_OUTPUT
  #           echo "dist_run_id=${{ needs.main-ci.outputs.dist_run_id }}" >> $GITHUB_OUTPUT
  #         fi

  pytorch-gpu-nvcr-container:
    name: PyTorch GPU ${{ matrix.torch_ci_image }}
    runs-on: prod-aitune-tester-rtx-pro-4500-v1
    timeout-minutes: 45
    needs: create-base-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch_ci_image: ghcr.io/ai-dynamo/aitune:nvcr-torch-25.08-py3
            extra_packages: "numpy<2.0"
          - torch_ci_image: ghcr.io/ai-dynamo/aitune:nvcr-torch-25.10-py3
            extra_packages: ""
          - torch_ci_image: ghcr.io/ai-dynamo/aitune:nvcr-torch-26.01-py3
            extra_packages: ""
          - torch_ci_image: ghcr.io/ai-dynamo/aitune:nvcr-torch-26.03-py3
            extra_packages: ""
          - torch_ci_image: ghcr.io/ai-dynamo/aitune:nvcr-torch-26.05-py3
            extra_packages: ""
          - torch_ci_image: ghcr.io/ai-dynamo/aitune:nvcr-torch-26.06-py3
            extra_packages: ""
    container:
      image: ${{ matrix.torch_ci_image }}
      options: -u 1000
    env:
      EXTRA_PACKAGES: ${{ matrix.extra_packages }}
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - run: pip install . --group test ${EXTRA_PACKAGES:+"$EXTRA_PACKAGES"}
      - run: pip list
      - run: nvidia-smi
      - run: python -c "import sys; print(sys.version)"
      - run: python -c "import torch; print(torch.__version__); print(torch.version.cuda)"
      - run: python -c "import torch; print(torch.cuda.is_available()); torch.cuda.init()"
      - run: python -c "import tensorrt; print(tensorrt.__version__)"
      - run: python -c "import torch_tensorrt; print(torch_tensorrt.__version__)"
      - run: pytest

  generate-functional-matrix:
    name: Generate functional matrix
    runs-on: linux-amd64-cpu4
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      matrix_count: ${{ steps.generate.outputs.matrix_count }}
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - name: Generate functional matrix
        id: generate
        env:
          AITUNE_TEST_SCOPE: L0
          AITUNE_EXAMPLE_SCOPE: ${{ github.event.inputs.example_scope || 'L1' }}
        run: |
          uv run --script tests/functional/scripts/generate.py \
            --default-docker-image "${{ env.PYTORCH_CI_IMAGE }}" \
            --scripts-path tests/functional/pytorch \
            --scripts-path tests/functional/pytorch/kernels \
            --scripts-path tests/functional/pytorch/jit \
            --scripts-path tests/functional/dataloader \
            --scripts-path tests/functional/dynamo \
            --github-output "$GITHUB_OUTPUT" \
            --only-tags gpu/4,gpu/8 \
            --output-json jobs.json

      - name: Display generated functional matrix
        if: always()
        run: |
          {
            echo "### Functional Matrix"
            echo -ne "\nTotal matrix items: ${{ steps.generate.outputs.matrix_count }}\n\n"
            echo "| ID | Path | Kind | Docker Image | Runner | Test Number |"
            echo "|----|------|------|--------------|--------|-------------|"
            jq -r '.[] | "| \(.id) | \(.path) | \(.kind) | \(.docker_image) | \(.runner) | \(.test_number) |"' jobs.json
            echo ""
          } >> $GITHUB_STEP_SUMMARY


        # --projects-path examples \

  functional:
    name: ${{ matrix.id }}
    needs: [wheel, generate-functional-matrix]
    if: needs.generate-functional-matrix.outputs.matrix_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-functional-matrix.outputs.matrix) }}
    container:
      image: ${{ matrix.docker_image }}
    env: ${{ fromJSON(matrix.environment) }}
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
          # run-id: ${{ needs.wheel.outputs.dist_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nvidia-smi
      - name: Run functional job
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python tests/functional/scripts/metadata.py ${{ matrix.path }} | tee script_metadata.json

          python tests/functional/scripts/execute.py \
            "${{ matrix.path }}" \
            --kind "${{ matrix.kind }}" \
            --test-number "${{ matrix.test_number }}" \
            --is-custom-docker-image "${{ matrix.is_custom_docker_image }}" \
            --verbose

      - if: always()
        uses: *actions_upload_artifact
        with:
          name: functional-${{ matrix.id }}
          path: |
            artifacts/**
            .cache/aitune/**/*.log
            .cache/aitune.jit/**/*.log
            hardware_metrics.csv
            script_metadata.json
            functional_test_requirements.txt
          if-no-files-found: ignore
