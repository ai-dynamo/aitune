name: PR and Main CI

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:
  workflow_call:
    secrets:
      FERN_TOKEN:
        required: true
      HF_TOKEN:
        required: true
    outputs:
      dist_run_id:
        description: Reusable workflow run ID for downloading the dist artifact
        value: ${{ jobs.wheel.outputs.run_id }}
      pytorch_ci_image:
        description: PyTorch image selected for this run
        value: ${{ jobs.wheel.outputs.image }}

permissions:
  contents: read

concurrency:
  group: pr-main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_VERSION: ${{ vars.UV_VERSION }}
  UV_PYTHON: &python_version "3.11"
  NODE_VERSION: &node_version "25"
  FERN_VERSION: "5.110.0"
  TORCH_CI_IMAGE: ${{ vars.TORCH_CI_IMAGE }}
  PYTORCH_CI_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: linux-amd64-cpu4
    env:
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: *python_version
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --group dev --group test --extra triton
      - run: uv run pre-commit run --all-files
      - name: Pyrefly checker
        run: uv run pyrefly check --error-stale-baseline

  license-headers:
    name: License headers
    runs-on: linux-amd64-cpu4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: *python_version
          version: ${{ env.UV_VERSION }}
      - name: Check license headers
        run: |
          TOOLS=.github/scripts/sanity
          LICENSE_HEADER_TOOL="uv run --script $TOOLS/license_headers.py --path . --license-template $TOOLS/license_header.template"
          $LICENSE_HEADER_TOOL --files "*.py"
          $LICENSE_HEADER_TOOL --files "*.sh"
          $LICENSE_HEADER_TOOL --files "*.md"
          $LICENSE_HEADER_TOOL --files "*.yaml"
          $LICENSE_HEADER_TOOL --files "*.yml"
          $LICENSE_HEADER_TOOL --files "*.toml"
          $LICENSE_HEADER_TOOL --files "*.html" --comment-style "<!--|| -->"
          $LICENSE_HEADER_TOOL --files "*.css"  --comment-style "/*|| */"
          $LICENSE_HEADER_TOOL --files "*.ini"
          $LICENSE_HEADER_TOOL --files "*.pbtxt"
          $LICENSE_HEADER_TOOL --files "Makefile"
          $LICENSE_HEADER_TOOL --files ".gitignore"
          $LICENSE_HEADER_TOOL --files ".flake8"
          $LICENSE_HEADER_TOOL --files ".dockerignore"
          $LICENSE_HEADER_TOOL --files ".editorconfig"

  packages-python:
    name: Packages licenses
    runs-on: linux-amd64-cpu4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: *python_version
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --group dev --group test --group doc --extra triton
      - run: uv pip install pip-licenses==5.5.5 toml==0.10.2
      - name: Check package licenses
        run: |
          TOOLS=.github/scripts/sanity
          uv run python $TOOLS/license_packages.py

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'push'
    runs-on: linux-amd64-cpu4
    permissions:
      pull-requests: write
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7.0.1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
        with:
          base-ref: main
          head-ref: ${{ github.ref }}
          fail-on-severity: critical
          comment-summary-in-pr: on-failure

  check-docs:
    name: Check docs
    continue-on-error: true
    runs-on: linux-amd64-cpu4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: *node_version
      - run: npm install -g fern-api@${{ env.FERN_VERSION }}

      - run: make docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

  wheel:
    name: Build wheel
    runs-on: linux-amd64-cpu4
    outputs:
      run_id: ${{ github.run_id }}
      build_image: ${{ steps.image.outputs.build_image }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select PyTorch image
        id: image
        run: |
          base=$(git merge-base origin/main HEAD)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             [ -n "$(git diff --name-only "$base" HEAD -- uv.lock .github/docker/Dockerfile )" ]; then
            echo "build_image=true" >> "$GITHUB_OUTPUT"
            echo "image=$PYTORCH_CI_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "build_image=false" >> "$GITHUB_OUTPUT"
            echo "image=$TORCH_CI_IMAGE" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: *python_version
          version: ${{ env.UV_VERSION }}
      - run: echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AITUNE=$(sh .github/scripts/scm_minor_version.sh)" >> "$GITHUB_ENV"
      - run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pythons-cpu:
    name: Pythons CPU
    needs: wheel
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            aitune-extra: torch29
          - python-version: "3.12"
            aitune-extra: torch29
          - python-version: "3.13"
            aitune-extra: torch29
          - python-version: "3.14"
            aitune-extra: torch214
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: ${{ env.UV_VERSION }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - run: |
          # The locked Triton deps cap grpcio below 1.68, which has no CPython 3.14 wheel.
          # Use a wheel-compatible grpcio only for Python 3.14 to avoid compiling from source.
          if [[ "$PYTHON_VERSION" == "3.14" ]]; then
            uv sync --frozen --group test --no-group dev --extra ${{ matrix.aitune-extra }} --extra triton --no-install-package grpcio
            uv pip install --no-deps grpcio==1.81.1
          else
            uv sync --frozen --group test --no-group dev --extra ${{ matrix.aitune-extra }} --extra triton
          fi
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - run: .venv/bin/python -m pytest -q -rf -n auto tests/unit --junitxml=python-${{ matrix.python-version }}.test-report.xml
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-cpu-test-report-${{ matrix.python-version }}
          path: python-${{ matrix.python-version }}.test-report.xml
          if-no-files-found: ignore

  pytorch-image:
    name: Build PyTorch image
    needs: wheel
    if: needs.wheel.outputs.build_image == 'true'
    runs-on: linux-amd64-cpu16
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: .github/docker/Dockerfile
          outputs: type=image,push=true,compression=zstd,oci-mediatypes=true
          build-args: |
            FROM_IMAGE=${{ env.TORCH_CI_IMAGE }}
            ADDITIONAL_PACKAGES=pytest
          tags: ${{ env.PYTORCH_CI_IMAGE }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd

  pytorch-cpu:
    name: PyTorch CPU
    needs: [wheel, pytorch-image]
    if: &wheel_and_image_ready >-
      ${{ !cancelled() && needs.wheel.result == 'success' &&
          (needs.pytorch-image.result == 'success' || needs.pytorch-image.result == 'skipped') }}
    runs-on: linux-amd64-cpu32
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.wheel.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - run: python -m pip install --force-reinstall --no-deps --break-system-packages dist/*.whl
      - run: python -m pytest -q -rf -n auto tests/unit --junitxml=pytorch-cpu.test-report.xml
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytorch-cpu-test-report
          path: pytorch-cpu.test-report.xml
          if-no-files-found: ignore

  pytorch-gpu:
    name: PyTorch GPU
    needs: [wheel, pytorch-image]
    if: *wheel_and_image_ready
    runs-on: prod-aitune-tester-rtx-pro-4500-v1
    # Fresh-process JIT cases include native backend import time for every test.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.wheel.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The k8s container hook adds about 20s to every step, so keep the step count low.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Run unit tests
        run: |
          echo "Container image: ${{ needs.wheel.outputs.image }}"
          echo "Checking onnxruntime_providers_cuda.so dependencies:"
          ldd /usr/local/lib/python3.12/dist-packages/onnxruntime/capi/libonnxruntime_providers_cuda.so
          python -m pip install --force-reinstall --no-deps --break-system-packages dist/*.whl
          python -m pytest -q -rf tests/unit \
            --cov=aitune \
            --cov-report=xml:coverage.xml \
            --junitxml=pytorch-gpu.test-report.xml
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytorch-gpu-results
          path: |
            coverage.xml
            pytorch-gpu.test-report.xml
          if-no-files-found: ignore

  functional-ci:
    name: Functional CI GPU
    needs: [wheel, pytorch-image]
    if: *wheel_and_image_ready
    runs-on: prod-aitune-tester-rtx-pro-4500-v1
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.wheel.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Functional CI tests
        run: |
          python -m pip install --force-reinstall --no-deps --break-system-packages dist/*.whl
          python -m pytest -rfEs --durations=0 tests/functional_ci --junitxml=functional-ci.test-report.xml
        env:
          AITUNE_MATRIX_RESULTS: functional-ci.matrix-updates.json
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: functional-ci-test-report
          path: |
            functional-ci.test-report.xml
            functional-ci.matrix-updates.json
          if-no-files-found: ignore
