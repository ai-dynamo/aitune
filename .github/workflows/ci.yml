name: PR and Main CI

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_VERSION: 0.11.8
  UV_PYTHON: &python_version "3.10"
  TORCH_CI_IMAGE: nvcr.io/nvidia/pytorch:25.10-py3
  PYTORCH_CI_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

  _ACTIONS_CHECKOUT: &actions_checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  _ACTIONS_SETUP_PYTHON: &actions_setup_python actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
  _ACTIONS_SETUP_UV: &actions_setup_uv astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
  _ACTIONS_DOWNLOAD_ARTIFACT: &actions_download_artifact actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
  _ACTIONS_UPLOAD_ARTIFACT: &actions_upload_artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  _ACTIONS_DOCKER_LOGIN: &actions_docker_login docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
  _ACTIONS_DOCKER_BUILD_PUSH: &actions_docker_build_push docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
  
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: linux-amd64-cpu4
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv sync --frozen --group dev
      - run: uv run pre-commit run --all-files


  pytype:
    name: Pytype
    runs-on: linux-amd64-cpu16
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv sync --frozen --group dev --group test
      - run: |
          set -o pipefail
          uv run pytype --keep-going -j auto aitune tests examples | tee pytype.log
      - if: always()
        uses: *actions_upload_artifact
        with:
          name: pytype-log
          path: pytype.log
          if-no-files-found: ignore

  wheel:
    name: Build wheel
    runs-on: linux-amd64-cpu4
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv build
      - uses: *actions_upload_artifact
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pythons-cpu:
    name: Pythons CPU
    needs: wheel
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        include:
          - python-version: "3.10"
          - python-version: "3.11"
          - python-version: "3.12"
          # - python-version: "3.13"
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: ${{ matrix.python-version }}
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - run: uv sync --frozen --group test --extra torch29
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - run: uv run pytest tests/unit --junitxml=python-${{ matrix.python-version }}.test-report.xml
      - if: always()
        uses: *actions_upload_artifact
        with:
          name: python-cpu-test-report
          path: python-cpu.test-report.xml
          if-no-files-found: ignore

  pytorch-image:
    name: Build PyTorch image
    needs: wheel
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      packages: write
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - uses: *actions_docker_login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: *actions_docker_build_push
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          build-args: |
            FROM_IMAGE=${{ env.TORCH_CI_IMAGE }}
            AIT_EXTRAS=pytest pytest-mock pytest-cov
          tags: ${{ env.PYTORCH_CI_IMAGE }}

  pytorch-cpu:
    name: PyTorch CPU
    needs: pytorch-image
    runs-on: linux-amd64-cpu32
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ env.PYTORCH_CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - run: python -m pytest tests/unit --junitxml=pytorch-cpu.test-report.xml
      - if: always()
        uses: *actions_upload_artifact
        with:
          name: pytorch-cpu-test-report
          path: pytorch-cpu.test-report.xml
          if-no-files-found: ignore

  pytorch-gpu:
    name: PyTorch GPU (L40S)
    needs: pytorch-image
    runs-on: prod-aitune-tester-l40s-v1
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ env.PYTORCH_CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --gpus all
    env:
      EXPECTED_GPU_COUNT: "1"
      EXPECTED_GPU_MODEL: L40S
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - name: Verify GPU
        run: |
          set -euo pipefail
          nvidia-smi
          gpu_names="$(nvidia-smi --query-gpu=name --format=csv,noheader)"
          gpu_count="$(printf '%s\n' "$gpu_names" | wc -l)"
          test "$gpu_count" -eq "$EXPECTED_GPU_COUNT"
          while IFS= read -r gpu_name; do
            [[ "$gpu_name" == *"$EXPECTED_GPU_MODEL"* ]]
          done <<< "$gpu_names"
      - run: >-
          python -m pytest tests/unit
          --cov=aitune
          --cov-report=xml:coverage.xml
          --junitxml=pytorch-gpu.test-report.xml
      - if: always()
        uses: *actions_upload_artifact
        with:
          name: pytorch-gpu-results
          path: |
            coverage.xml
            pytorch-gpu.test-report.xml
          if-no-files-found: ignore
