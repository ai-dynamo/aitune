name: PR and Main CI

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:
  workflow_call:
    secrets:
      FERN_TOKEN:
        required: true
      HF_TOKEN:
        required: true
    outputs:
      dist_run_id:
        description: Reusable workflow run ID for downloading the dist artifact
        value: ${{ jobs.wheel.outputs.run_id }}
      pytorch_ci_image:
        description: PyTorch image selected for this run
        value: ${{ jobs.wheel.outputs.image }}

permissions:
  contents: read

concurrency:
  group: pr-main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com
  UV_VERSION: 0.11.8
  UV_PYTHON: &python_version "3.11"
  NODE_VERSION: &node_version "25"
  FERN_VERSION: "5.110.0"
  TORCH_CI_IMAGE: ghcr.io/ai-dynamo/aitune/nvcr-torch-26.01-py3:latest # daily updated image AITune container image
  PYTORCH_CI_IMAGE: &pytorch_ci_image ghcr.io/${{ github.repository }}:${{ github.sha }}

  _ACTIONS_CHECKOUT: &actions_checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  _ACTIONS_SETUP_UV: &actions_setup_uv astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
  _ACTIONS_DOWNLOAD_ARTIFACT: &actions_download_artifact actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
  _ACTIONS_UPLOAD_ARTIFACT: &actions_upload_artifact actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
  _ACTIONS_DOCKER_LOGIN: &actions_docker_login docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
  _ACTIONS_DOCKER_BUILD_PUSH: &actions_docker_build_push docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
  _ACTIONS_SETUP_NODE: &actions_setup_node actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
  _ACTIONS_DEPENDENCY_REVIEW: &actions_dependency_review actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: linux-amd64-cpu4
    env:
      SKIP: no-commit-to-branch
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv sync --frozen --group dev
      - run: uv run pre-commit run --all-files

  pytype:
    name: Pytype
    runs-on: linux-amd64-cpu16
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv sync --frozen --group dev --group test
      - name: Pytype checker
        run: |
          set -o pipefail
          uv run pytype --keep-going -j auto aitune tests examples | tee pytype.log

      - if: always()
        uses: *actions_upload_artifact
        with:
          name: pytype-log
          path: pytype.log
          if-no-files-found: ignore

  license-headers:
    name: License headers
    runs-on: linux-amd64-cpu4
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - name: Check license headers
        run: |
          TOOLS=.github/scripts/sanity
          LICENSE_HEADER_TOOL="uv run --script $TOOLS/license_headers.py --path . --license-template $TOOLS/license_header.template"
          $LICENSE_HEADER_TOOL --files "*.py"
          $LICENSE_HEADER_TOOL --files "*.sh"
          $LICENSE_HEADER_TOOL --files "*.md"
          $LICENSE_HEADER_TOOL --files "*.yaml"
          $LICENSE_HEADER_TOOL --files "*.yml"
          $LICENSE_HEADER_TOOL --files "*.toml"
          $LICENSE_HEADER_TOOL --files "*.html" --comment-style "<!--|| -->"
          $LICENSE_HEADER_TOOL --files "*.css"  --comment-style "/*|| */"
          $LICENSE_HEADER_TOOL --files "*.ini"
          $LICENSE_HEADER_TOOL --files "*.pbtxt"
          $LICENSE_HEADER_TOOL --files "Makefile"
          $LICENSE_HEADER_TOOL --files ".gitignore"
          $LICENSE_HEADER_TOOL --files ".flake8"
          $LICENSE_HEADER_TOOL --files ".dockerignore"
          $LICENSE_HEADER_TOOL --files ".editorconfig"

  packages-python:
    name: Packages licenses
    runs-on: linux-amd64-cpu4
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv sync --frozen --group dev --group test --group doc
      - run: uv pip install pip-licenses==5.5.5 toml==0.10.2
      - name: Check package licenses
        run: |
          TOOLS=.github/scripts/sanity
          uv run python $TOOLS/license_packages.py

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'push'
    runs-on: linux-amd64-cpu4
    permissions:
      pull-requests: write
    steps:
      - name: 'Checkout Repository'
        uses: *actions_checkout
      - name: 'Dependency Review'
        uses: *actions_dependency_review
        with:
          base-ref: main
          head-ref: ${{ github.ref }}
          fail-on-severity: critical
          comment-summary-in-pr: on-failure

  check-docs:
    name: Check docs
    continue-on-error: true
    runs-on: linux-amd64-cpu4
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_node
        with:
          node-version: *node_version
      - run: npm install -g fern-api@${{ env.FERN_VERSION }}

      - run: make docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

  wheel:
    name: Build wheel
    runs-on: linux-amd64-cpu4
    outputs:
      run_id: ${{ github.run_id }}
      build_image: ${{ steps.image.outputs.build_image }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select PyTorch image
        id: image
        run: |
          base=$(git merge-base origin/main HEAD)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             [ -n "$(git diff --name-only "$base" HEAD -- uv.lock .github/docker/Dockerfile )" ]; then
            echo "build_image=true" >> "$GITHUB_OUTPUT"
            echo "image=$PYTORCH_CI_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "build_image=false" >> "$GITHUB_OUTPUT"
            echo "image=$TORCH_CI_IMAGE" >> "$GITHUB_OUTPUT"
          fi
      - uses: *actions_setup_uv
        with:
          python-version: *python_version
      - run: uv build
      - uses: *actions_upload_artifact
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pythons-cpu:
    name: Pythons CPU
    needs: wheel
    runs-on: linux-amd64-cpu4
    strategy:
      matrix:
        include:
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_setup_uv
        with:
          python-version: ${{ matrix.python-version }}
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - run: uv sync --frozen --group test --extra torch29
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - run: .venv/bin/python -m pytest -q -rf -n auto tests/unit --junitxml=python-${{ matrix.python-version }}.test-report.xml
      - if: always()
        uses: *actions_upload_artifact
        with:
          name: python-cpu-test-report-${{ matrix.python-version }}
          path: python-${{ matrix.python-version }}.test-report.xml
          if-no-files-found: ignore

  pytorch-image:
    name: Build PyTorch image
    needs: wheel
    if: needs.wheel.outputs.build_image == 'true'
    runs-on: linux-amd64-cpu16
    permissions:
      contents: read
      packages: write
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - uses: *actions_docker_login
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: *actions_docker_build_push
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          build-args: |
            FROM_IMAGE=${{ env.TORCH_CI_IMAGE }}
            ADDITIONAL_PACKAGES=pytest
          tags: ${{ env.PYTORCH_CI_IMAGE }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd

  pytorch-cpu:
    name: PyTorch CPU
    needs: [wheel, pytorch-image]
    if: >-
      ${{ !cancelled() && needs.wheel.result == 'success' &&
          (needs.pytorch-image.result == 'success' || needs.pytorch-image.result == 'skipped') }}
    runs-on: linux-amd64-cpu32
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.wheel.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - run: python -m pip install --force-reinstall --no-deps --break-system-packages dist/*.whl
      - run: python -m pytest -q -rfn auto tests/unit --junitxml=pytorch-cpu.test-report.xml
      - if: always()
        uses: *actions_upload_artifact
        with:
          name: pytorch-cpu-test-report
          path: pytorch-cpu.test-report.xml
          if-no-files-found: ignore

  pytorch-gpu:
    name: PyTorch GPU
    needs: [wheel, pytorch-image]
    if: >-
      ${{ !cancelled() && needs.wheel.result == 'success' &&
          (needs.pytorch-image.result == 'success' || needs.pytorch-image.result == 'skipped') }}
    runs-on: prod-aitune-tester-rtx-pro-4500-v1
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.wheel.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: *actions_checkout
        with:
          persist-credentials: false
      - uses: *actions_download_artifact
        with:
          name: dist
          path: dist
      - run: python -m pip install --force-reinstall --no-deps --break-system-packages dist/*.whl
      - run: >-
          python -m pytest -q -rf tests/unit
          --cov=aitune
          --cov-report=xml:coverage.xml
          --junitxml=pytorch-gpu.test-report.xml
      - if: always()
        uses: *actions_upload_artifact
        with:
          name: pytorch-gpu-results
          path: |
            coverage.xml
            pytorch-gpu.test-report.xml
          if-no-files-found: ignore

