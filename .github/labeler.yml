# Labels are applied to pull requests based on changed files.

backend::tensorrt:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/torch/backend/tensorrt/**
          - aitune/torch/libs/torch/**

backend::triton:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/triton/**
          - examples/**/triton/**

component::dynamo:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/dynamo/**
          - examples/**/dynamo/**

component::jit:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/torch/jit/**

component::inspection:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/torch/inspecting/**

component::tuning:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/torch/tune_strategy/**
          - aitune/torch/task/**
          - aitune/torch/tuning.py

component::checkpoint:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/torch/checkpoint/**

component::profiling:
  - changed-files:
      - any-glob-to-any-file:
          - aitune/torch/performance/**
          - aitune/torch/task/profiling/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - examples/**/README.md
          - fern/**
          - '**/*.md'
          - '**/*.rst'

examples:
  - changed-files:
      - any-glob-to-any-file:
          - examples/**
          - notebooks/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .pre-commit-config.yaml

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - uv.lock
          - requirements*.txt
